<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Control</title>
<style>
:root{--ground:#F6F7F9;--panel:#FFFFFF;--border:#E4E7EC;--ink:#101828;--muted:#5B6474;--accent:#2952CC;--accent-ink:#1E3E9E;
--green:#12805C;--green-bg:#E7F5EE;--warn:#B54708;--warn-bg:#FFFAEB;--warn-border:#FEC84B;--red:#B42318;
--left:#2952CC;--center:#C2410C;--right:#7A3EC8;--table:#FBFBFC;--line:#D0D5DD}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);font-size:14px}
header{height:64px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:24px;padding:0 32px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}.logo b{width:28px;height:28px;border-radius:8px;background:var(--ink);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
.pill{font-size:13px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:4px 12px}
.status{font-size:13px;display:flex;align-items:center;gap:6px;color:var(--green)}.status i{width:8px;height:8px;border-radius:50%;background:currentColor}
.status.warn{color:var(--warn)}.status.idle{color:var(--muted)}
.grow{flex:1}
label.sw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
nav.steps{display:flex;gap:8px;padding:16px 32px;flex-wrap:wrap;font-size:13px}
nav.steps button{font:inherit;padding:6px 12px;border-radius:999px;color:var(--muted);background:var(--panel);border:1px solid var(--border);cursor:pointer}
nav.steps button.done{color:var(--green);background:var(--green-bg);border-color:var(--green-bg)}
nav.steps button.on{color:#fff;background:var(--accent);border-color:var(--accent);font-weight:600}
main{display:flex;flex-wrap:wrap;gap:24px;padding:0 32px 32px}
section.left{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:16px}
aside{flex:1 1 340px;max-width:420px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:24px;font-weight:600}h2{margin:0;font-size:18px;font-weight:600}h3{margin:0 0 6px;font-size:15px;font-weight:600}
.sub{margin:6px 0 0;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
.card.sel{border:2px solid var(--accent)}
.card.warnc{background:var(--warn-bg);border-color:var(--warn-border)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
button.b{font:500 14px inherit;font-family:inherit;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
button.p{font:600 15px inherit;font-family:inherit;padding:12px 18px;border-radius:10px;border:none;background:var(--accent);color:#fff;cursor:pointer}
button.p:disabled,button.b:disabled{opacity:.5;cursor:default}
button.stop{background:var(--red)}
button.dash{border-style:dashed;background:transparent}
input,select,textarea{font:14px inherit;font-family:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input.n{width:84px}textarea{width:100%;min-height:52px}
.lbl{font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:12.5px}
table.kv{border-collapse:collapse;width:100%;font-size:13px}table.kv td{padding:5px 4px;border-bottom:1px solid #F0F1F3;vertical-align:middle}
table.kv td:first-child{color:var(--muted);word-break:break-word}table.kv input,table.kv select{width:100%;padding:5px 8px}
details.more{border-top:1px solid var(--border);padding-top:10px}details.more summary{cursor:pointer;font-weight:500}
.eng{display:none}body.details .eng{display:block}
svg.table{width:100%;height:auto;display:block;background:#fff;border-radius:8px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.err{color:var(--red);font-size:13px;min-height:18px}
.log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;max-height:260px;overflow:auto;white-space:pre-wrap;color:var(--ink)}
.kpis{display:flex;gap:12px;flex-wrap:wrap}.kpi{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 14px;min-width:130px}
.kpi b{display:block;font-size:20px}.kpi span{font-size:12.5px;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.modes button{text-align:left;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--border);background:#fff;cursor:pointer}
.modes button.on{border:2px solid var(--accent);padding:11px}
.modes button b{display:block;margin-bottom:2px}
.frames li{margin:4px 0}
.hidden{display:none !important}
@media (max-width:720px){header,nav.steps,main{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<header>
  <div class="logo"><b>M</b><span style="font-weight:600;font-size:16px">Mission Control</span></div>
  <span class="pill" id="wsname">School table</span>
  <div class="grow"></div>
  <span class="status idle" id="status"><i></i><span>Ready</span></span>
  <label class="sw"><input type="checkbox" id="details"> Details</label>
</header>
<nav class="steps" aria-label="Steps" id="steps"></nav>
<main id="main"></main>
<script>
"use strict";
const STEPS = ["Connect", "Setup", "Workspace", "Warm-up", "Mission", "Run", "Review"];
const COL = {Left: "#2952CC", Center: "#C2410C", Right: "#7A3EC8"};
const SIDES = ["x_min", "x_max", "y_min", "y_max"];
const SIDE_WORDS = {x_min: "Left side", x_max: "Right side", y_min: "Bottom side (audience)", y_max: "Top side"};
let S = null, screen = 0, done = new Set(), mode = "program", prog = null, conn = "sim", spotMode = null, zoneStart = null;
let playT = 0, playing = false, timer = null, pollT = null;

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }
function fmt(t) { t = Math.max(0, Math.round(t)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); }
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
async function load() { S = await api("/api/state"); render(); }

// ---------------------------------------------------------------- the table picture
function tableSVG(opt) {
  const f = opt.floor || S.map.floor, pad = 8, W = 760;
  const x0 = f.x_min - pad, x1 = f.x_max + pad, y0 = f.y_min - pad, y1 = f.y_max + pad;
  const k = W / (x1 - x0), H = (y1 - y0) * k;
  const X = x => ((x - x0) * k).toFixed(1), Y = y => ((y1 - y) * k).toFixed(1);
  let o = `<svg class="table" viewBox="0 0 ${W} ${H.toFixed(0)}" role="img" aria-label="${esc(opt.label || "The table seen from above")}" ${opt.id ? `id="${opt.id}"` : ""}>`;
  o += `<rect x="${X(f.x_min)}" y="${Y(f.y_max)}" width="${((f.x_max - f.x_min) * k).toFixed(1)}" height="${((f.y_max - f.y_min) * k).toFixed(1)}" fill="var(--table)" stroke="#98A2B3" stroke-dasharray="6 5"/>`;
  const sides = (opt.sides !== undefined ? opt.sides : S.map.sides) || {};
  for (const sd of SIDES) {
    const v = sides[sd]; if (!v) continue;
    const lo = sd[0] === "x" ? f.y_min : f.x_min, hi = sd[0] === "x" ? f.y_max : f.x_max;
    const bar = v.kind === "barrier" ? [[lo, hi]] : v.kind === "partial" ? (v.barrier || []) : [];
    const opn = []; let a = lo;
    for (const [b0, b1] of (v.kind === "barrier" ? [[lo, hi]] : bar)) { if (b0 > a) opn.push([a, b0]); a = Math.max(a, b1); }
    if (a < hi && v.kind !== "barrier") opn.push([a, hi]);
    const seg = (s0, s1, st) => { const line = f[sd]; const p = sd[0] === "x" ? [X(line), Y(s0), X(line), Y(s1)] : [X(s0), Y(line), X(s1), Y(line)];
      o += `<line x1="${p[0]}" y1="${p[1]}" x2="${p[2]}" y2="${p[3]}" ${st} stroke-linecap="round"/>`; };
    bar.forEach(s => seg(s[0], s[1], 'stroke="#101828" stroke-width="4"'));
    opn.forEach(s => seg(s[0], s[1], v.kind === "unknown" ? 'stroke="#98A2B3" stroke-width="3" stroke-dasharray="2 5"' : 'stroke="#D92D20" stroke-width="3" stroke-dasharray="7 5"'));
  }
  for (const z of (opt.keepouts || S.map.keepouts || [])) {
    const pend = z.status === "proposed";
    o += `<polygon points="${z.polygon.map(p => X(p[0]) + "," + Y(p[1])).join(" ")}" fill="#D92D20" fill-opacity="${pend ? .08 : .16}" stroke="#D92D20" stroke-width="1.5" ${pend ? 'stroke-dasharray="4 3"' : ""}/>`;
  }
  for (const ob of (opt.obstacles || [])) {
    if (ob.points) o += `<polygon points="${ob.points.map(p => X(p[0]) + "," + Y(p[1])).join(" ")}" fill="#5B6474" fill-opacity=".35" stroke="#5B6474"/>`;
    else if (ob.center) o += `<circle cx="${X(ob.center[0])}" cy="${Y(ob.center[1])}" r="${(ob.radius * k).toFixed(1)}" fill="#5B6474" fill-opacity=".35"/>`;
  }
  if (opt.segs) {
    // the routine's parts, each in its own line style with its name at its start; the part each robot is in at the
    // slider's time drawn strong, the rest faint (Nick 2026-10-28: the game of Chicken was lost in one line)
    const labels = [];
    for (const [n, segs] of Object.entries(opt.segs)) {
      const cur = curSeg(segs, opt.t || 0);
      segs.forEach((sg, i) => {
        const on = i === cur, st = BLOCK_STYLE[sg.block.split(" ")[0]] || BLOCK_STYLE.move;
        if (sg.pts.length > 1) o += `<polyline points="${sg.pts.map(p => X(p[0]) + "," + Y(p[1])).join(" ")}" fill="none" stroke="${COL[n] || "#5B6474"}" stroke-width="${on ? st.w + 1.4 : st.w}" stroke-opacity="${on ? .95 : .3}" stroke-dasharray="${st.dash}" stroke-linejoin="round" stroke-linecap="round"/>`;
        else o += `<circle cx="${X(sg.pts[0][0])}" cy="${Y(sg.pts[0][1])}" r="${on ? 9 : 7}" fill="none" stroke="${COL[n] || "#5B6474"}" stroke-opacity="${on ? .95 : .35}" stroke-width="1.5" stroke-dasharray="2 3"/>`;
        const p0 = sg.pts[0];
        labels.push({on, x: +X(p0[0]) + 5, y: +Y(p0[1]) - 5, w: sg.block.length * (on ? 7.2 : 6.2),
          t: `font-size="${on ? 12 : 10.5}" font-weight="${on ? 700 : 500}" fill="${COL[n] || "#5B6474"}" fill-opacity="${on ? 1 : .75}" stroke="#fff" stroke-width="3" paint-order="stroke">${esc(sg.block)}`});
      });
    }
    // the parts now under way are named first; a faint name that would overlap one already placed is left out
    const placed = [];
    labels.sort((a, b) => b.on - a.on).forEach(l => {
      if (!l.on && placed.some(q => l.x < q.x + q.w && q.x < l.x + l.w && Math.abs(l.y - q.y) < 13)) return;
      placed.push(l); o += `<text x="${l.x.toFixed(1)}" y="${l.y.toFixed(1)}" ${l.t}</text>`;
    });
  }
  for (const [n, pts] of Object.entries(opt.segs ? {} : (opt.paths || {}))) {
    if (pts.length > 1) o += `<polyline points="${pts.map(p => X(p[0]) + "," + Y(p[1])).join(" ")}" fill="none" stroke="${COL[n] || "#5B6474"}" stroke-width="${opt.pathW || 1.6}" stroke-opacity="${opt.pathOp || .45}" stroke-linejoin="round"/>`;
  }
  const spots = opt.spots !== undefined ? opt.spots : (S.map.spots || {});
  for (const [nm, p] of Object.entries(spots)) {
    o += `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="11" fill="#fff" stroke="#101828" stroke-width="2"/><text x="${X(p[0])}" y="${(+Y(p[1]) + 4.5).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="700" fill="#101828">${esc(nm)}</text>`;
  }
  for (const [n, p] of Object.entries(opt.robots || {})) {
    const r = 4.75 * k, h = (p[2] || 0) * Math.PI / 180;
    o += `<g><circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${r.toFixed(1)}" fill="${COL[n] || "#5B6474"}" fill-opacity=".9" stroke="#fff" stroke-width="2"/>` +
      `<line x1="${X(p[0])}" y1="${Y(p[1])}" x2="${X(p[0] + 4.75 * Math.cos(h))}" y2="${Y(p[1] + 4.75 * Math.sin(h))}" stroke="#fff" stroke-width="2"/></g>`;
  }
  o += `<text x="${X(f.x_min + (f.x_max - f.x_min) / 2)}" y="${(H - 4).toFixed(0)}" text-anchor="middle" font-size="11" fill="#5B6474">audience side</text>`;
  return o + "</svg>";
}
function svgToFloor(svg, ev) {
  const f = S.map.floor, pad = 8, W = 760, k = W / (f.x_max - f.x_min + 2 * pad), rc = svg.getBoundingClientRect();
  const sx = (ev.clientX - rc.left) * (W / rc.width), sy = (ev.clientY - rc.top) * (W / rc.width);
  return [+(sx / k + f.x_min - pad).toFixed(1), +((f.y_max + pad) - sy / k).toFixed(1)];
}

// ---------------------------------------------------------------- settings tables (every setting, any view)
function settingsTable(group, keys) {
  const cur = S.settings[group] || {}, def = S.defaults[group] || {};
  const ks = keys || Object.keys(def);
  let o = `<table class="kv" data-group="${group}">`;
  for (const k of ks) {
    const v = k in cur ? cur[k] : def[k];
    const inp = typeof def[k] === "boolean" ? `<select data-k="${k}"><option ${v ? "selected" : ""}>true</option><option ${!v ? "selected" : ""}>false</option></select>`
      : `<input data-k="${k}" value="${esc(v)}" aria-label="${esc(k)}">`;
    o += `<tr><td>${esc(k)}</td><td>${inp}</td></tr>`;
  }
  return o + `</table><div class="row" style="margin-top:8px"><button class="b" data-save="${group}">Save ${esc(group)} settings</button></div>`;
}
function wireSettings(root) {
  root.querySelectorAll("[data-save]").forEach(b => b.onclick = async () => {
    const g = b.dataset.save, def = S.defaults[g], out = {};
    root.querySelectorAll(`table[data-group="${g}"] [data-k]`).forEach(i => {
      const k = i.dataset.k, d = def[k];
      out[k] = typeof d === "boolean" ? i.value === "true" : typeof d === "number" ? Number(i.value) : i.value;
    });
    try { S = await api("/api/settings", {[g]: out}); flash("Saved"); } catch (e) { flash(e.message, true); }
  });
}
function more(title, inner, open) { return `<details class="more" ${open || document.body.classList.contains("details") ? "open" : ""}><summary>${esc(title)}</summary><div style="margin-top:10px">${inner}</div></details>`; }
function flash(t, bad) { const e = $("err"); if (e) { e.textContent = t; e.style.color = bad ? "var(--red)" : "var(--green)"; } }

// ---------------------------------------------------------------- screens
function render() {
  $("wsname").textContent = (S.map.notes && S.map.notes.length < 40) ? S.map.notes : "School table";
  $("steps").innerHTML = STEPS.map((s, i) => `<button class="${i === screen ? "on" : done.has(i) ? "done" : ""}" data-i="${i}">${i + 1} ${s}${done.has(i) && i !== screen ? " ✓" : ""}</button>`).join("");
  $("steps").querySelectorAll("button").forEach(b => b.onclick = () => { screen = +b.dataset.i; render(); });
  const run = S.run;
  const st = $("status");
  if (run && run.running) { st.className = "status warn"; st.lastChild.textContent = run.paused ? "Paused" : `Running ${run.kind} · ${fmt(run.elapsed_s)}`; }
  else { st.className = "status"; st.lastChild.textContent = `${S.map.robots.length} robots ready`; }
  [connect, setup, workspace, warmup, mission, runScreen, review][screen]();
}
function page(left, right) { $("main").innerHTML = `<section class="left">${left}<div class="err" id="err"></div></section><aside>${right}</aside>`; wireSettings($("main")); }

function connect() {
  page(`<div><h1>Connect</h1><p class="sub">Choose the robots or the simulator. The simulator runs the same plans on simulated Alviks.</p></div>
    <div class="card"><div class="modes">
      <button class="${conn === "sim" ? "on" : ""}" data-c="sim"><b>Simulator</b><span class="small muted">Dry run on this computer</span></button>
      <button class="${conn === "sim-cameras" ? "on" : ""}" data-c="sim-cameras"><b>Simulator through the cameras</b><span class="small muted">The simulated overhead and side cameras through the camera bridge, as on the Pi</span></button>
      <button class="${conn === "robots" ? "on" : ""}" data-c="robots"><b>Robots</b><span class="small muted">On the room's WiFi, the Pi's two cameras</span></button>
    </div></div>
    <div class="card">${tableSVG({robots: Object.fromEntries(S.map.robots.map(r => [r.name, r.start]))})}
      <div class="legend" style="margin-top:8px">${S.map.robots.map(r => `<span><span class="dot" style="background:${COL[r.name]}"></span>${esc(r.name)} at (${r.start[0]}, ${r.start[1]})</span>`).join("")}</div>
      <p class="small muted" style="margin:6px 0 0">Robots drawn where the map puts them to start; the table seen from above, audience side at the bottom.</p></div>`,
    `<div class="card"><h2>Robots</h2>${S.map.robots.map(r => `<div class="between" style="padding:8px 0;border-bottom:1px solid #F0F1F3"><b><span class="dot" style="background:${COL[r.name]}"></span>${esc(r.name)}</b><span class="muted small">${conn !== "robots" ? "simulated" : "firmware 2026-10-28a expected"}</span></div>`).join("")}
      <p class="small muted">${conn === "robots" ? "Robots: firmware 2026-10-28a (the arc and the dance; the school's network). Before anything moves the engine checks each robot's firmware, battery (25 % floor), restarts (calibrates again), and reads back every setting it sends." : "Simulator: no robots needed."}</p>
      ${more("More", settingsTable("run", ["edge_guard", "border_cm", "timeout_s"]))}</div>
      <button class="p" id="go">Continue to workspace</button>`);
  $("main").querySelectorAll("[data-c]").forEach(b => b.onclick = () => { conn = b.dataset.c; render(); });
  $("go").onclick = () => { done.add(0); screen = 1; render(); };
}

// ---------------------------------------------------------------- one-button setup (flash check, chessboard, warm-up)
let setupPoll = null;
function setup() {
  const j = S.setup || {};
  page(`<div><h1>Set up the cameras</h1><p class="sub">One button: the flash check, then the chessboard in the 0,0 corner for both cameras, then the warm-up. About 3 minutes.</p></div>
    <div class="card"><h2>Before you press it</h2><ol class="small">
      <li>Both cameras on, the recorder stopped (the setup page needs the cameras).</li>
      <li>The robots on the table, switched on (their lights are flashed).</li>
      <li>The printed corner piece A (squares of 3.5 cm) flat in the table's <b>0,0 corner</b>: its white-dot corner in the table's corner, the 5-square side along the table's long side. No robot on it.</li>
      <li>When the setup asks, take the chessboard away and press <b>Chessboard taken away</b>: the warm-up starts then.</li></ol></div>
    <div class="card"><h2>Progress</h2><div class="log" id="slog">${esc((j.steps || []).map(x => x.join("  ")).join("\n")) || "Not started"}</div>
      ${j.wait_board ? `<p><button class="p" id="bway">Chessboard taken away</button></p>` : ""}
      ${j.error ? `<p class="err">${esc(j.error)}</p>` : ""}</div>`,
    `<div class="card"><h2>Setup</h2><p class="small muted">${conn === "robots" ? "The Pi's cameras" : "Simulated cameras (the setup page's own fake board and robots)"}</p>
      <button class="p" id="sgo" ${j.running ? "disabled" : ""}>${j.running ? "Running..." : "Set up (flash check, chessboard, warm-up)"}</button>
      ${more("More", `<p class="small muted">Each part can be run alone on the camera setup page (port 8096): <code>./run-fleet-pi.sh setup</code>.</p>`)}</div>
      <button class="b" id="go">Continue to workspace</button>`);
  $("sgo").onclick = async () => { try { S.setup = await api("/api/setup/start", {conn}); render(); clearInterval(setupPoll);
    setupPoll = setInterval(async () => { S.setup = await api("/api/setup"); if (screen === 1) render(); if (!S.setup.running) { clearInterval(setupPoll); load(); } }, 1500); } catch (e) { flash(e.message, true); } };
  $("go").onclick = () => { done.add(1); screen = 2; render(); };
  if ($("bway")) $("bway").onclick = async () => { try { S.setup = await api("/api/setup/board_away", {}); render(); } catch (e) { flash(e.message, true); } };
  const lg = $("slog"); if (lg) lg.scrollTop = lg.scrollHeight;
}

function workspace() {
  const f = S.map.floor, sides = S.map.sides || {};
  const sideRows = SIDES.map(sd => { const v = sides[sd] || {kind: "unknown"};
    return `<div style="display:grid;grid-template-columns:1fr 120px;gap:6px;align-items:center;margin:4px 0"><span class="lbl">${SIDE_WORDS[sd]}</span>
      <select data-side="${sd}">${["unknown", "open", "barrier", "partial"].map(k => `<option ${v.kind === k ? "selected" : ""}>${k}</option>`).join("")}</select>
      ${v.kind === "partial" ? `<input data-span="${sd}" style="grid-column:1/3" value="${esc((v.barrier || []).map(b => b.join("-")).join(", "))}" aria-label="barrier stretches along the ${SIDE_WORDS[sd]}">` : ""}</div>`; }).join("");
  const zones = (S.map.keepouts || []);
  page(`<div><h1>Mark the working area</h1><p class="sub">The table's size and what each side is. Spots are where robots can be sent; no-go zones are kept clear.</p></div>
    <div class="card">${tableSVG({id: "ws"})}

const BLOCK_HELP = {"mow-region": "robot · from, to (share of the table's length, 0-1) · direction + or -",

function blockParams(b) { return Object.entries(b).filter(([k]) => !["block", "robot", "robots"].includes(k)).map(([k, v]) => `${k}=${Array.isArray(v) ? v.join(" ") : v}`).join(", "); }
function parseParams(txt) {
  const o = {};

    const [k, v0] = part.split("=").map(x => x.trim()); if (!k || v0 === undefined) throw new Error(`"${part}": use name=value`);
    const ws = v0.split(/\s+/);

}
function readProgram() {

const BLOCK_STYLE = {mow: {dash: "none", w: 1.6}, meet: {dash: "2 4", w: 1.8}, circle: {dash: "none", w: 2.4},
  chicken: {dash: "9 4", w: 2.2}, spread: {dash: "1 3 7 3", w: 1.8}, dance: {dash: "2 3", w: 1.6}, move: {dash: "4 3", w: 1.6}};
function curSeg(segs, t) { let c = 0; segs.forEach((sg, i) => { if (sg.t0 <= t) c = i; }); return c; }
function nowWords(pv, t) { return pv.segs ? Object.entries(pv.segs).map(([n, sg]) => `<span><span class="dot" style="background:${COL[n]}"></span>${n}: <b>${esc(sg[curSeg(sg, t)].block)}</b></span>`).join("") : ""; }

  $("slider").oninput = e => { playT = +e.target.value; upd(); };
  $("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "❚❚" : "▶";
    clearInterval(timer); if (playing) timer = setInterval(() => { playT += 0.5; if (playT >= pv.makespan_s) { playT = pv.makespan_s; playing = false; clearInterval(timer); } if ($("slider")) upd(); }, 100); };
}

function runScreen() {
  const run = S.run && S.run.kind !== "warmup" ? S.run : null, pv = S.preview && S.preview.title !== "Warm-up" ? S.preview : null;
  page(`<div class="between"><div><h1>${pv ? esc(MODES.find(m => m[0] === String(pv.title).toLowerCase())?.[1] || pv.title) : "Run"}</h1><p class="sub">${run ? `${fmt(run.elapsed_s)} in${pv ? " · planned " + fmt(pv.makespan_s) : ""}` : "Not started"}</p></div>
      <div class="row"><button class="p" id="start" ${run && run.running ? "disabled" : ""}>Run (${conn === "robots" ? "robots" : "simulator"})</button>
      <button class="b" id="pause" ${run && run.running ? "" : "disabled"}>${run && run.paused ? "Resume" : "Pause"}</button><button class="p stop" id="stop" ${run && run.running ? "" : "disabled"}>Stop</button></div></div>
    <div class="card">${tableSVG({paths: pv ? pv.paths : {}, pathOp: .25, robots: run ? run.robots : {}, obstacles: pv ? pv.obstacles : []})}
      <p class="small muted" style="margin:8px 0 0">Where the camera sees each robot now (${conn === "robots" ? "overhead camera" : "simulated camera"}), over the planned routes.</p></div>
    ${run && run.mode && run.mode !== "sim" ? `<div class="card"><h3>The cameras now</h3><div class="row" style="align-items:flex-start">
      <figure style="margin:0;flex:1 1 300px"><img id="camo" alt="The overhead camera's picture with each robot ringed" src="/api/frame?cam=overhead&t=${Date.now()}" style="width:100%;border-radius:8px"><figcaption class="small muted">Overhead camera (${run.mode === "robots" ? "the Pi's" : "simulated"}): each robot ringed in its colour where the camera bridge has it, planned routes as thin lines.</figcaption></figure>
      <figure style="margin:0;flex:1 1 300px"><img id="cams" alt="The side camera's picture with each robot ringed" src="/api/frame?cam=side&t=${Date.now()}" style="width:100%;border-radius:8px" onerror="this.parentElement.style.display='none'"><figcaption class="small muted">Side camera, the same rings.</figcaption></figure></div></div>
      <div class="card eng"><h3>How the robots mapped the table</h3><div id="mapv">Loading...</div><p class="small muted">Each robot's path as the camera bridge saw it this run, in its colour (mapview.py).</p></div>` : ""}`,
    `${(pv ? Object.keys(pv.frames) : S.map.robots.map(r => r.name)).map(n => { const lv = run && run.live && run.live.robots ? run.live.robots[n] : null;
      return `<div class="card"><div class="between"><b><span class="dot" style="background:${COL[n]}"></span>${esc(n)}</b><span class="small muted">${run && run.robots[n] ? `(${run.robots[n][0].toFixed(0)}, ${run.robots[n][1].toFixed(0)})` : ""}</span></div>
      <span class="small muted">${esc(lv && lv.out ? "OUT: " + lv.out : (lv && lv.doing) || (run && run.doing && run.doing[n]) || (run && run.running ? "driving" : "waiting"))}</span>
      ${lv ? `<div class="row small" style="margin-top:6px;gap:14px"><span>Battery <b>${lv.battery ?? "-"} %</b></span><span>Edge <b>${lv.edge_cm ?? "-"} cm</b></span><span>Steps <b>${lv.done}/${lv.steps}</b></span></div><div class="small muted">${esc(lv.last || "")}</div>` : ""}</div>`; }).join("")}
     <details class="card" ${document.body.classList.contains("details") ? "open" : ""}><summary style="cursor:pointer;font-weight:500">Event log</summary><div class="log" id="log">${run ? esc((run.messages || []).map(m => `[${m[0]}] ${m[1]}`).join("\n")) : ""}</div></details>
     <div class="card">${more("More", settingsTable("run"))}</div>
     <button class="p" id="go" ${run && !run.running ? "" : "disabled"}>Review</button>`);
  $("start").onclick = async () => { try { await api("/api/run/start", {kind: "mission", dry: conn !== "robots", conn}); startPoll(); await load(); } catch (e) { flash(e.message, true); } };
  $("pause").onclick = async () => { try { await api("/api/run/pause", {on: !(run && run.paused)}); await load(); } catch (e) { flash(e.message, true); } };
  $("stop").onclick = async () => { try { await api("/api/run/stop", {}); await load(); } catch (e) { flash(e.message, true); } };
  $("go").onclick = () => { done.add(5); screen = 6; render(); };
  const lg = $("log"); if (lg) lg.scrollTop = lg.scrollHeight;
  if ($("mapv")) api("/api/mapping").then(r => { $("mapv").innerHTML = r.svg; }).catch(() => {});
}
function startPoll() { clearInterval(pollT); pollT = setInterval(async () => { const r = await api("/api/run"); S.run = r; if (screen === 5 || screen === 3) render(); if (!r.running) { clearInterval(pollT); load(); } }, 1000); }

async function review() {
  page(`<div><h1>Review</h1><p class="sub">The last run: what happened against the plan.</p></div><div id="rv" class="card">Loading...</div>`,
    `<div class="card"><h2>Next</h2><p class="small muted">Change the mission or the workspace and run again; every run is kept in its own folder.</p><button class="b" id="again">Back to mission</button></div>`);
  $("again").onclick = () => { screen = 4; render(); };
  let r;
  try { r = await api("/api/review"); } catch (e) { $("rv").innerHTML = `<p class="muted">${esc(e.message)}</p>`; return; }
  const s = r.run_plan_summary || {}, sim = r.sim_report || (s.simulator || {});
  const re = s.replans || [];
  const kp = [[s.duration_s ? fmt(s.duration_s) : "-", "Took"], [s.planned_makespan_s ? fmt(s.planned_makespan_s) : "-", "Planned"],
    [sim.min_body_gap_cm != null ? sim.min_body_gap_cm.toFixed(1) + " cm" : "-", "Closest two robots (simulator truth)"],
    [sim.min_open_edge_cm != null ? sim.min_open_edge_cm.toFixed(1) + " cm" : "-", "Closest to an open edge"], [String(re.length), "Re-plans"]];
  $("rv").innerHTML = `<div class="kpis">${kp.map(k => `<div class="kpi"><b>${esc(k[0])}</b><span>${esc(k[1])}</span></div>`).join("")}</div>
    <div style="margin-top:12px">${tableSVG({paths: r.tracks, pathOp: .8, pathW: 2, obstacles: (sim.events || []).filter(e => e.kind === "brick").map(e => ({points: e.points}))})}</div>
    <p class="small muted">Each robot's path as the camera saw it (${esc(r.folder)}); grey: the brick that was dropped.</p>
    <div class="eng"><h3>Re-plans</h3><ul class="small">${re.map(x => `<li>${x.t_run} s, ${esc(x.source)}: ${x.cpu_s} s to compute${x.kept === false ? ", not kept" : ""}</li>`).join("") || "<li>none</li>"}</ul>
    <h3>Simulator events</h3><ul class="small">${(sim.events || []).map(e => `<li>${esc(JSON.stringify(e).slice(0, 160))}</li>`).join("") || "<li>none</li>"}</ul></div>`;
}

$("details").onchange = e => { document.body.classList.toggle("details", e.target.checked); render(); };
load().then(() => { if (S.run && S.run.running) startPoll(); });
</script>
</body>
</html>
