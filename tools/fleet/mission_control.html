<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Control</title>
<style>
:root{--ground:#F6F7F9;--panel:#FFFFFF;--border:#E4E7EC;--ink:#101828;--muted:#5B6474;--accent:#2952CC;--accent-ink:#1E3E9E;
--green:#12805C;--green-bg:#E7F5EE;--warn:#B54708;--warn-bg:#FFFAEB;--warn-border:#FEC84B;--red:#B42318;
--left:#2952CC;--center:#C2410C;--right:#7A3EC8;--table:#FBFBFC;--line:#D0D5DD}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);font-size:14px}
header{min-height:64px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:24px;padding:0 32px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}.logo b{width:28px;height:28px;border-radius:8px;background:var(--ink);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
.pill{font-size:13px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:4px 12px}
.status{font-size:13px;display:flex;align-items:center;gap:6px;color:var(--green)}.status i{width:8px;height:8px;border-radius:50%;background:currentColor}
.status.warn{color:var(--warn)}.status.idle{color:var(--muted)}
.grow{flex:1}
label.sw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
nav.steps{display:flex;gap:8px;padding:16px 32px;flex-wrap:wrap;font-size:13px}
nav.steps button{font:inherit;padding:6px 12px;border-radius:999px;color:var(--muted);background:var(--panel);border:1px solid var(--border);cursor:pointer}
nav.steps button.done{color:var(--green);background:var(--green-bg);border-color:var(--green-bg)}
nav.steps button.on{color:#fff;background:var(--accent);border-color:var(--accent);font-weight:600}
main{display:flex;flex-wrap:wrap;gap:24px;padding:0 32px 32px}
section.left{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:16px}
aside{flex:1 1 340px;max-width:420px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:24px;font-weight:600}h2{margin:0;font-size:18px;font-weight:600}h3{margin:0 0 6px;font-size:15px;font-weight:600}
.sub{margin:6px 0 0;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
.card.sel{border:2px solid var(--accent)}
.card.warnc{background:var(--warn-bg);border-color:var(--warn-border)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
button.b{font:500 14px inherit;font-family:inherit;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
button.p{font:600 15px inherit;font-family:inherit;padding:12px 18px;border-radius:10px;border:none;background:var(--accent);color:#fff;cursor:pointer}
button.p:disabled,button.b:disabled{opacity:.5;cursor:default}
button.stop{background:var(--red)}
button.dash{border-style:dashed;background:transparent}
input,select,textarea{font:14px inherit;font-family:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input.n{width:84px}textarea{width:100%;min-height:52px}
.lbl{font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:12.5px}
table.kv{border-collapse:collapse;width:100%;font-size:13px}table.kv td{padding:5px 4px;border-bottom:1px solid #F0F1F3;vertical-align:middle}
table.kv td:first-child{color:var(--muted);word-break:break-word}table.kv input,table.kv select{width:100%;padding:5px 8px}
details.more{border-top:1px solid var(--border);padding-top:10px}details.more summary{cursor:pointer;font-weight:500}
.eng{display:none}body.details .eng{display:block}
svg.table{width:100%;height:auto;display:block;background:#fff;border-radius:8px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.err{color:var(--red);font-size:13px;min-height:18px}
.log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;max-height:260px;overflow:auto;white-space:pre-wrap;color:var(--ink)}
.kpis{display:flex;gap:12px;flex-wrap:wrap}.kpi{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 14px;min-width:130px}
.kpi b{display:block;font-size:20px}.kpi span{font-size:12.5px;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.modes button{text-align:left;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--border);background:#fff;cursor:pointer}
.modes button.on{border:2px solid var(--accent);padding:11px}
.modes button b{display:block;margin-bottom:2px}
.frames li{margin:4px 0}
.hidden{display:none !important}
/* (e07) the Start screen: four big buttons, a red Stop, plain status */
button.stopall{font:700 16px inherit;font-family:inherit;padding:10px 22px;border-radius:10px;border:none;background:var(--red);color:#fff;cursor:pointer;letter-spacing:.02em}
button.stopall:hover{filter:brightness(1.08)}
.mode{border-radius:12px;padding:12px 16px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mode.practice{background:#EEF2FF;color:#1E3E9E;border:1px solid #C7D2FE}.mode.robots{background:#FEF3F2;color:var(--red);border:1px solid #FECDCA}
.seen{display:grid;gap:8px}.seen div{display:flex;gap:10px;align-items:baseline;font-size:15px}.seen b{min-width:64px;color:var(--muted);font-weight:500;font-size:13px}
.bigs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.bigs button{text-align:left;font:inherit;padding:22px 20px;border-radius:14px;border:2px solid var(--accent);background:#fff;cursor:pointer;min-height:118px}
.bigs button b{display:block;font-size:22px;color:var(--accent-ink);margin-bottom:6px}
.bigs button span{color:var(--muted);font-size:13.5px;line-height:1.35}
.bigs button:hover:not(:disabled){background:#F5F7FF}
.bigs button:disabled{border-color:var(--border);cursor:default}.bigs button:disabled b{color:var(--muted)}
.corners{background:#FFFAEB;border:2px solid #F79009;border-radius:14px;padding:18px}
.corners b{font-size:18px}
.quiz .q{margin:14px 0 6px;font-weight:600;font-size:15px}.quiz .modes button{min-height:58px}
.prefs .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px 16px;margin-top:10px;align-items:start}.prefs h3{margin:16px 0 6px}
.prefs .why{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.prefs label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}.prefs label select,.prefs label input{color:var(--ink)}
.statusbox{border-left:4px solid var(--accent);padding-left:12px}
details.adv>summary{font-weight:600;cursor:pointer;color:var(--muted)}
details.adv .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px}
details.adv label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
@media (max-width:720px){.bigs{grid-template-columns:1fr}}
@media (max-width:720px){header,nav.steps,main{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<header>
  <div class="logo"><b>M</b><span style="font-weight:600;font-size:16px">Mission Control</span></div>
  <span class="pill" id="wsname">School table</span>
  <span class="pill" id="connmode" title="Which mode runs go to (chosen on the Connect screen)">Mode: Simulator</span>
  <div class="grow"></div>
  <span class="status idle" id="status"><i></i><span>Ready</span></span>
  <button class="stopall" id="stopall" title="Stops every robot at once">STOP</button>
  <label class="sw"><input type="checkbox" id="details"> Details</label>
</header>
<nav class="steps" aria-label="Steps" id="steps"></nav>
<main id="main"></main>
<script>
"use strict";
const STEPS = ["Connect", "Setup", "Workspace", "Warm-up", "Mission", "Run", "Review", "Cameras & table", "Production", "Start"];
// a site with AprilTags on the robots (2026-11-02, tools/fleet/sites.py): its own steps; home keeps the first seven
function isTags() { return !!(S && S.site && S.site.tracking === "tags"); }
// tracking by the robots' lights at a tag site (2026-11-03): the corner-clicking Setup screen comes back (the camera bridge's
// floor calibration); roof tags and no camera keep the tag site's steps
function stepOrder() { return isTags() ? ((S.tracking_now === "lights") ? [0, 1, 7, 8, 5, 6] : [0, 7, 8, 5, 6]) : [0, 1, 2, 3, 4, 5, 6]; }
const COL = {Left: "#2952CC", Center: "#C2410C", Right: "#7A3EC8"};
const SIDES = ["x_min", "x_max", "y_min", "y_max"];
const SIDE_WORDS = {x_min: "Left side", x_max: "Right side", y_min: "Bottom side (audience)", y_max: "Top side"};
let S = null, screen = 9, done = new Set(), mode = "mow", prog = null, conn = "sim", spotMode = null, zoneStart = null;
let connPicked = false;   // the Connect screen follows the server's default (robots on the Pi with real cameras) until a mode is picked
const CONN_WORDS = {sim: "Simulator", "sim-cameras": "Simulator through the cameras", robots: "Robots"};
let playT = 0, playing = false, timer = null, pollT = null;

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }
function fmt(t) { t = Math.max(0, Math.round(t)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); }
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
async function load() { S = await api("/api/state"); if (S.site && S.site.colours) Object.assign(COL, S.site.colours);
  if (!connPicked && S.conn_default) conn = S.conn_default.mode; if (isTags() && conn === "sim" && !connPicked) conn = "sim-cameras";
  if (isTags() && S.feel && S.feel.conn !== conn) { try { S.feel = await api("/api/feel?conn=" + encodeURIComponent(conn)); } catch (e) {} }
  render(); }

// ---------------------------------------------------------------- the table picture
function tableSVG(opt) {
  const f = opt.floor || S.map.floor, pad = 8, W = 760;
  const x0 = f.x_min - pad, x1 = f.x_max + pad, y0 = f.y_min - pad, y1 = f.y_max + pad;
  const k = W / (x1 - x0), H = (y1 - y0) * k;
  const X = x => ((x - x0) * k).toFixed(1), Y = y => ((y1 - y) * k).toFixed(1);
  let o = `<svg class="table" viewBox="0 0 ${W} ${H.toFixed(0)}" role="img" aria-label="${esc(opt.label || "The table seen from above")}" ${opt.id ? `id="${opt.id}"` : ""}>`;
  o += `<rect x="${X(f.x_min)}" y="${Y(f.y_max)}" width="${((f.x_max - f.x_min) * k).toFixed(1)}" height="${((f.y_max - f.y_min) * k).toFixed(1)}" fill="var(--table)" stroke="#98A2B3" stroke-dasharray="6 5"/>`;
  const sides = (opt.sides !== undefined ? opt.sides : S.map.sides) || {};
  for (const sd of SIDES) {
    const v = sides[sd]; if (!v) continue;
    const lo = sd[0] === "x" ? f.y_min : f.x_min, hi = sd[0] === "x" ? f.y_max : f.x_max;
    const bar = v.kind === "barrier" ? [[lo, hi]] : v.kind === "partial" ? (v.barrier || []) : [];
    const opn = []; let a = lo;
    for (const [b0, b1] of (v.kind === "barrier" ? [[lo, hi]] : bar)) { if (b0 > a) opn.push([a, b0]); a = Math.max(a, b1); }
    if (a < hi && v.kind !== "barrier") opn.push([a, hi]);
    const seg = (s0, s1, st) => { const line = f[sd]; const p = sd[0] === "x" ? [X(line), Y(s0), X(line), Y(s1)] : [X(s0), Y(line), X(s1), Y(line)];
      o += `<line x1="${p[0]}" y1="${p[1]}" x2="${p[2]}" y2="${p[3]}" ${st} stroke-linecap="round"/>`; };
    bar.forEach(s => seg(s[0], s[1], 'stroke="#101828" stroke-width="4"'));
    opn.forEach(s => seg(s[0], s[1], v.kind === "unknown" ? 'stroke="#98A2B3" stroke-width="3" stroke-dasharray="2 5"' : 'stroke="#D92D20" stroke-width="3" stroke-dasharray="7 5"'));
  }
  for (const z of (opt.keepouts || S.map.keepouts || [])) {
    const pend = z.status === "proposed";
    o += `<polygon points="${z.polygon.map(p => X(p[0]) + "," + Y(p[1])).join(" ")}" fill="#D92D20" fill-opacity="${pend ? .08 : .16}" stroke="#D92D20" stroke-width="1.5" ${pend ? 'stroke-dasharray="4 3"' : ""}/>`;
  }
  for (const ob of (opt.obstacles || [])) {
    if (ob.points && ob.unconfirmed) {
      // only a robot's distance sensor saw it (2026-10-29): dashed, with a "?"; it leaves the map unless confirmed
      const cx = ob.points.reduce((a, p) => a + p[0], 0) / ob.points.length, cy = ob.points.reduce((a, p) => a + p[1], 0) / ob.points.length;
      o += `<polygon points="${ob.points.map(p => X(p[0]) + "," + Y(p[1])).join(" ")}" fill="#DC6803" fill-opacity=".12" stroke="#DC6803" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${X(cx)}" y="${Y(cy) + 4}" text-anchor="middle" font-size="12" font-weight="600" fill="#B54708">?${ob.expires_in_s != null ? " " + Math.round(ob.expires_in_s) + "s" : ""}</text>`;
    } else if (ob.points) o += `<polygon points="${ob.points.map(p => X(p[0]) + "," + Y(p[1])).join(" ")}" fill="#5B6474" fill-opacity=".35" stroke="#5B6474"/>`;
    else if (ob.center) o += `<circle cx="${X(ob.center[0])}" cy="${Y(ob.center[1])}" r="${(ob.radius * k).toFixed(1)}" fill="#5B6474" fill-opacity=".35"/>`;
  }
  if (opt.segs) {
    // the routine's parts, each in its own line style with its name at its start; the part each robot is in at the
    // slider's time drawn strong, the rest faint (Nick 2026-10-28: the game of Chicken was lost in one line)
    const labels = [];
    for (const [n, segs] of Object.entries(opt.segs)) {
      const cur = curSeg(segs, opt.t || 0);
      segs.forEach((sg, i) => {
        const on = i === cur, st = BLOCK_STYLE[sg.block.split(" ")[0]] || BLOCK_STYLE.move;
        if (sg.pts.length > 1) o += `<polyline points="${sg.pts.map(p => X(p[0]) + "," + Y(p[1])).join(" ")}" fill="none" stroke="${COL[n] || "#5B6474"}" stroke-width="${on ? st.w + 1.4 : st.w}" stroke-opacity="${on ? .95 : .3}" stroke-dasharray="${st.dash}" stroke-linejoin="round" stroke-linecap="round"/>`;
        else o += `<circle cx="${X(sg.pts[0][0])}" cy="${Y(sg.pts[0][1])}" r="${on ? 9 : 7}" fill="none" stroke="${COL[n] || "#5B6474"}" stroke-opacity="${on ? .95 : .35}" stroke-width="1.5" stroke-dasharray="2 3"/>`;
        const p0 = sg.pts[0];
        labels.push({on, x: +X(p0[0]) + 5, y: +Y(p0[1]) - 5, w: sg.block.length * (on ? 7.2 : 6.2),
          t: `font-size="${on ? 12 : 10.5}" font-weight="${on ? 700 : 500}" fill="${COL[n] || "#5B6474"}" fill-opacity="${on ? 1 : .75}" stroke="#fff" stroke-width="3" paint-order="stroke">${esc(sg.block)}`});
      });
    }
    // the parts now under way are named first; a faint name that would overlap one already placed is left out
    const placed = [];
    labels.sort((a, b) => b.on - a.on).forEach(l => {
      if (!l.on && placed.some(q => l.x < q.x + q.w && q.x < l.x + l.w && Math.abs(l.y - q.y) < 13)) return;
      placed.push(l); o += `<text x="${l.x.toFixed(1)}" y="${l.y.toFixed(1)}" ${l.t}</text>`;
    });
  }
  for (const [n, pts] of Object.entries(opt.segs ? {} : (opt.paths || {}))) {
    if (pts.length > 1) o += `<polyline points="${pts.map(p => X(p[0]) + "," + Y(p[1])).join(" ")}" fill="none" stroke="${COL[n] || "#5B6474"}" stroke-width="${opt.pathW || 1.6}" stroke-opacity="${opt.pathOp || .45}" stroke-linejoin="round"/>`;
  }
  const spots = opt.spots !== undefined ? opt.spots : (S.map.spots || {});
  for (const [nm, p] of Object.entries(spots)) {
    o += `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="11" fill="#fff" stroke="#101828" stroke-width="2"/><text x="${X(p[0])}" y="${(+Y(p[1]) + 4.5).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="700" fill="#101828">${esc(nm)}</text>`;
  }
  for (const [n, p] of Object.entries(opt.robots || {})) {
    const r = 4.75 * k, h = (p[2] || 0) * Math.PI / 180;
    o += `<g><circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${r.toFixed(1)}" fill="${COL[n] || "#5B6474"}" fill-opacity=".9" stroke="#fff" stroke-width="2"/>` +
      `<line x1="${X(p[0])}" y1="${Y(p[1])}" x2="${X(p[0] + 4.75 * Math.cos(h))}" y2="${Y(p[1] + 4.75 * Math.sin(h))}" stroke="#fff" stroke-width="2"/></g>`;
  }
  o += `<text x="${X(f.x_min + (f.x_max - f.x_min) / 2)}" y="${(H - 4).toFixed(0)}" text-anchor="middle" font-size="11" fill="#5B6474">audience side</text>`;
  return o + "</svg>";
}
function svgToFloor(svg, ev) {
  const f = S.map.floor, pad = 8, W = 760, k = W / (f.x_max - f.x_min + 2 * pad), rc = svg.getBoundingClientRect();
  const sx = (ev.clientX - rc.left) * (W / rc.width), sy = (ev.clientY - rc.top) * (W / rc.width);
  return [+(sx / k + f.x_min - pad).toFixed(1), +((f.y_max + pad) - sy / k).toFixed(1)];
}

// ---------------------------------------------------------------- settings tables (every setting, any view)
function motionNow() { return ((S.settings || {}).planner || {}).motion || ((S.defaults || {}).planner || {}).motion || "stopturn"; }
function settingsTable(group, keys) {
  const cur = S.settings[group] || {}, def = S.defaults[group] || {};
  const ks = keys || Object.keys(def);
  let o = `<table class="kv" data-group="${group}">`;
  for (const k of ks) {
    const v = k in cur ? cur[k] : def[k];
    const inp = k === "motion" ? `<select data-k="${k}"><option ${v === "stopturn" ? "selected" : ""}>stopturn</option><option ${v === "curves" ? "selected" : ""}>curves</option></select>`
      : typeof def[k] === "boolean" ? `<select data-k="${k}"><option ${v ? "selected" : ""}>true</option><option ${!v ? "selected" : ""}>false</option></select>`
      : `<input data-k="${k}" value="${esc(v)}" aria-label="${esc(k)}">`;
    o += `<tr><td>${esc(k)}</td><td>${inp}</td></tr>`;
  }
  return o + `</table><div class="row" style="margin-top:8px"><button class="b" data-save="${group}">Save ${esc(group)} settings</button></div>`;
}
function wireSettings(root) {
  root.querySelectorAll("[data-save]").forEach(b => b.onclick = async () => {
    const g = b.dataset.save, def = S.defaults[g], out = {};
    root.querySelectorAll(`table[data-group="${g}"] [data-k]`).forEach(i => {
      const k = i.dataset.k, d = def[k];
      out[k] = typeof d === "boolean" ? i.value === "true" : typeof d === "number" ? Number(i.value) : i.value;
    });
    try { S = await api("/api/settings", {[g]: out}); const gn = S.gap_notices || [];
      render(); flash(gn.length ? "Saved, with the 8 cm lock: " + gn.join("; ") : "Saved", gn.length > 0); } catch (e) { flash(e.message, true); }
  });
}
function more(title, inner, open) { return `<details class="more" ${open || document.body.classList.contains("details") ? "open" : ""}><summary>${esc(title)}</summary><div style="margin-top:10px">${inner}</div></details>`; }
function flash(t, bad) { const e = $("err"); if (e) { e.textContent = t; e.style.color = bad ? "var(--red)" : "var(--green)"; } }

// ---------------------------------------------------------------- screens
function render() {
  $("wsname").textContent = (S.map.notes && S.map.notes.length < 40) ? S.map.notes : "School table";
  const allScr = !!(S.start && S.start.advanced && S.start.advanced.show_all_screens) || document.body.classList.contains("details");
  $("steps").innerHTML = S.start ? (allScr ? `<button class="${screen === 9 ? "on" : ""}" data-i="9">Start</button>` + stepOrder().map((i, k) => `<button class="${i === screen ? "on" : done.has(i) ? "done" : ""}" data-i="${i}">${k + 1} ${STEPS[i]}${done.has(i) && i !== screen ? " ✓" : ""}</button>`).join("") : "")
    : stepOrder().map((i, k) => `<button class="${i === screen ? "on" : done.has(i) ? "done" : ""}" data-i="${i}">${k + 1} ${STEPS[i]}${done.has(i) && i !== screen ? " ✓" : ""}</button>`).join("");
  if (!S.start && screen === 9) screen = stepOrder()[0];
  if (isTags()) $("wsname").textContent = S.site.title;
  $("steps").querySelectorAll("button").forEach(b => b.onclick = () => { screen = +b.dataset.i; render(); });
  const run = S.run;
  const st = $("status");
  const ss = S.start && S.start.status;
  if (ss && ss.running) { st.className = "status warn"; st.lastChild.textContent = `${ss.title}${ss.practice ? " (practice)" : ""} · ${fmt(ss.elapsed_s || 0)}`; }
  else if (run && run.running) { st.className = "status warn"; st.lastChild.textContent = run.paused ? "Paused" : `Running ${run.kind} · ${fmt(run.elapsed_s)}`; }
  else { st.className = "status"; st.lastChild.textContent = `${S.map.robots.length} robots ready`; }
  const cm = $("connmode");

// is compared with the cameras' outline, a side felt more than 2 cm further in is moved in (at most 10 cm), and it is saved for
// this table and camera setup, so later runs skip it.
const SIDE_NAME = {x_min: "Corner-1 end", x_max: "Far end", y_min: "Near long side", y_max: "Far long side"};
function feelSVG(F) {
  const sv = F.saved; if (!sv || !sv.outline_camera) return "";
  const oc = sv.outline_camera, ou = sv.outline_used || oc, pad = 14;
  const x0 = Math.min(oc[0], ou[0]) - pad, y0 = Math.min(oc[1], ou[1]) - pad, x1 = Math.max(oc[2], ou[2]) + pad, y1 = Math.max(oc[3], ou[3]) + pad;
  const W = 560, k = W / (x1 - x0), H = (y1 - y0) * k, X = x => (x - x0) * k, Y = y => H - (y - y0) * k;
  const rect = (r, st) => `<rect x="${X(r[0]).toFixed(1)}" y="${Y(r[3]).toFixed(1)}" width="${((r[2] - r[0]) * k).toFixed(1)}" height="${((r[3] - r[1]) * k).toFixed(1)}" ${st}/>`;
  const pts = (sv.feels || []).map(f => { const c = COL[f.robot] || "#5B6474";
    if (f.felt_xy) return `<circle cx="${X(f.felt_xy[0]).toFixed(1)}" cy="${Y(f.felt_xy[1]).toFixed(1)}" r="4.5" fill="${c}"><title>${esc(f.robot)} felt the drop at ${esc(f.id)} (${f.offset_cm > 0 ? "+" : ""}${f.offset_cm} cm from the camera's line)</title></circle>`;
    const p = f.place || [null, null]; return p[0] == null ? "" : `<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="4.5" fill="none" stroke="${c}" stroke-width="2"><title>${esc(f.robot)} at ${esc(f.id)}: ${esc(f.kind)}</title></circle>`; }).join("");
  return `<svg class="table" viewBox="0 0 ${W} ${H.toFixed(0)}" role="img" aria-label="The table from above: the cameras' outline dashed, the outline in use solid, the edges the robots felt as dots">
    ${rect(oc, 'fill="var(--table)" stroke="#98A2B3" stroke-width="1.5" stroke-dasharray="6 4"')}${rect(ou, 'fill="none" stroke="var(--ink)" stroke-width="2"')}${pts}</svg>
    <p class="small muted" style="margin:6px 0 0">The table from above (corner 1 bottom left): dashed, the cameras' outline; solid, the outline the runs use; dots, where each robot (its colour) felt the drop; rings, crawls that felt nothing.</p>`;
}
function feelCard() {

    : F.phase === "failed" ? "Did not finish" : F.phase === "no crawls" ? "Surface check failed: no crawls"
    : on ? "Runs before the next production run" : F.needed ? "Off for this run (you chose it)" : sv ? "Saved: skipped" : "";

  const warn = surfBad || F.phase === "held" || F.phase === "failed" || (sv && sv.hold) || (sv && sv.adjusted && Object.keys(sv.adjusted).length)
    || (sv && sv.sides && Object.values(sv.sides).some(d => d.verdict === "further out" || d.verdict === "suspect"));
  const prog = F.progress ? Object.entries(F.progress).map(([n, p]) => `<div style="margin:6px 0"><div class="between small"><b><span class="dot" style="background:${COL[n] || "#5B6474"}"></span>${esc(n)}</b><span>${p.done} of ${p.total} spots · ${p.felt} felt</span></div>

      <div class="small muted">${esc(p.now || (p.done ? "" : "calibrating, then on its way"))}</div></div>`).join("") : "";
  const sides = sv && sv.sides ? `<table class="kv" style="margin-top:8px"><tr><td>Side</td><td>Felt vs camera</td><td>Change</td></tr>${Object.entries(SIDE_NAME).map(([k, nm]) => { const d = sv.sides[k] || {};

  const words = (running || F.phase !== "idle" ? F.words : (sv && sv.words) || []) || [];
  return `<div class="card ${warn ? "warnc" : ""}" id="feelc"><div class="between"><h2>Feel out the table</h2><span class="small" style="color:${warn ? "var(--warn)" : "var(--muted)"}">${esc(head)}</span></div>
    <p class="small muted" style="margin:4px 0 8px">${esc(F.why || "")}</p>
    ${running ? `<p class="small" style="margin:0 0 6px">${F.elapsed_s != null ? fmt(F.elapsed_s) + " in" : ""}${F.planned_s ? " · the crawls take about " + fmt(F.planned_s) + " after the calibration (about 1:05)" : ""}</p>${prog}` : ""}

      <button class="b" id="feelnow" ${running || (S.run && S.run.running) ? "disabled" : ""}>Feel out now</button></div></div>`;

async function savePrefs(d) { try { S.start = await api("/api/start/prefs", d); flash("Saved"); render(); } catch (e) { flash(e.message, true); } }
function startScreen() {
  const T = S.start; const a = T.advanced || {}; const st = T.status || {}; const going = !!st.running;
  const where = T.where || {};
  const cd = T.code || {};      // (e12) Mission Control's own code changed after a git pull
  const codeBanner = cd.changed ? `<div class="card warnc" id="codebanner"><b>New code on the Pi</b><p style="margin:6px 0 10px">${esc(cd.words || "")}</p><button class="p" id="restartmc" ${going || cd.running ? "disabled" : ""}>${going || cd.running ? "Restart after the run ends" : "Restart Mission Control now"}</button></div>` : "";
  const mode = `<div class="mode ${T.practice ? "practice" : "robots"}"><span>${esc(T.mode_words)}</span><span class="small" style="font-weight:400">${esc(where.words || "")}</span></div>`;
  const seen = `<div class="card seen"><div><b>Place</b><span>${esc(placeName(where))}</span></div><div><b>Robots</b><span id="srobots">${esc(T.robots.words)}</span></div><div><b>Area</b><span>${esc(T.area)}</span></div>${T.map ? `<div><b>Table</b><span>${esc(T.map)}</span></div>` : ""}</div>`;
  const corners = T.corners_needed ? `<div class="corners"><b>One thing to do first: click the table's corners</b><p style="margin:6px 0 12px">${esc(T.corners_needed)} It takes a minute and is only needed once here.</p><button class="p" id="gocorners">Show me the picture to click</button></div>` : "";
  const bigs = `<div class="bigs">${T.buttons.map(b => `<button data-run="${b.kind}" ${(!b.ok || going) ? "disabled" : ""} title="${esc(b.ok ? b.sub : b.why)}"><b>${esc(b.title)}</b><span>${esc(b.ok ? b.sub : b.why)}</span></button>`).join("")}</div>`;
  const stat = st.kind ? `<div class="card statusbox"><div class="between"><h2>${esc(st.title)}${st.practice ? " (practice)" : ""}</h2><span class="muted small">${st.elapsed_s != null ? fmt(st.elapsed_s) : ""}</span></div>
    <p style="margin:6px 0;font-size:15px">${esc(st.words || "")}${st.points ? " Points done: " + esc(String(st.points)) + "." : ""}</p>
    ${(st.needs_hand || []).length ? `<div class="corners needhand" style="border-color:var(--red);color:var(--red)"><b>A robot at the table's edge needs a hand now: move it a hand's width onto the board and it rejoins by itself</b>${st.needs_hand.map(w => `<p style="margin:6px 0">${esc(w)}</p>`).join("")}</div>` : ""}
    ${(st.edge_parked || []).length ? `<div class="corners" style="border-color:var(--red);color:var(--red)"><b>A robot was left at the table's edge: someone must move it before the next run</b>${st.edge_parked.map(w => `<p style="margin:6px 0">${esc(w)}</p>`).join("")}</div>` : ""}
    ${(st.questions || []).map(q => `<div class="corners question" data-q="${esc(q.id)}"><b>A question from the run (${esc(q.robot)} is held until you answer)</b><p style="margin:6px 0 12px">${esc(q.text)}</p><div class="row">${(q.choices || []).map(c => `<button class="p" data-qid="${esc(q.id)}" data-choice="${esc(c)}">${esc(c)}</button>`).join(" ")}</div></div>`).join("")}
    ${(st.lines || []).length ? `<div class="log" style="max-height:180px">${esc(st.lines.join("\n"))}</div>` : ""}
    ${going ? `<div class="row" style="margin-top:10px"><button class="stopall" id="stopbig">STOP every robot</button></div>` : `<p class="small muted" style="margin:8px 0 0">${T.advanced.sleep_when_done && !st.practice && !st.refused && !st.sleep_words ? "The robots were sent to sleep (Advanced: sleep when a run ends)." : ""} Its folder: ${esc(st.folder || "")}</p>`}</div>` : "";
  const ty = T.typed || {};
  const adv = `<details class="adv card" id="advbox"><summary>Advanced (typed values and switches; nothing here is needed to run)</summary>
    <h3 style="margin-top:14px">Typed values (first guesses only: the cameras measure these, and win when they disagree; each disagreement is logged)</h3>
    <div class="grid">
      <label>Table length (cm)<input data-typed="table_length_cm" value="${esc(ty.table_length_cm ?? "")}"></label>
      <label>Table width (cm)<input data-typed="table_width_cm" value="${esc(ty.table_width_cm ?? "")}"></label>
      <label>Roof tag height (cm)<input data-typed="tag_height_cm" value="${esc(ty.tag_height_cm ?? "")}"></label>
      <label>Points file<input disabled value="${esc(ty.points_file || "none")}"></label></div>
    <div class="row" style="margin-top:8px"><button class="b" id="savetyped">Save typed values</button><span class="small muted">Saved on this computer only (the site file is not changed).</span></div>
    <h3 style="margin-top:16px">Switches</h3>
    <div class="grid">
      ${advTick("sleep_when_done", a, "Robots sleep as soon as a run ends")}
      ${advTick("sleep_timer", a, "Sleep after " + (a.sleep_timer_min || 30) + " minutes with no run (old timer)")}
      <label>Firmware check${advSel("min_firmware", a)}</label>
      <label>Corner clicking${advSel("corner_clicks", a)}</label>
      <label>Line sensor marks with no drop${advSel("surface_marks", a)}</label>
      <label>Cameras or typed values${advSel("measure_trust", a)}</label>
      <label>A lost robot's way back${advSel("recover_reserve", a)}</label>
      <label>Stop lead in missions${advSel("stop_lead", a)}</label>
      <label>Experiment routes${advSel("experiment", a)}</label>
      <label>Free roam driving${advSel("roam_motion", a)}</label>
      <label>Curves in the calibration${advSel("calib_curves", a)}</label>
      <label>Practice runs take${advSel("practice_path", a)}</label>
      <label>Visit points in your order${advSel("visit_order", a)}</label>
      <label>Free roam minutes (school)<input data-advn="roam_min" value="${esc(a.roam_min)}"></label>
      ${advTick("allow_half_table", a, "Experiments may use the half the camera cannot read (Dr. Sodhi agreed)")}
      ${advTick("practice_breaks", a, "Practice runs break the guesses on purpose (turned tags, dark patch, clock off, a restart)")}
      <label>Practice robots<input data-advn="practice_robots" value="${esc(a.practice_robots)}"></label>
      <label>Place<select id="sitepin"><option value="">Found by itself (automatic)</option>${(T.sites.names || []).map(n => `<option value="${esc(n)}" ${T.sites.pinned === n ? "selected" : ""}>Always use ${esc(n)}</option>`).join("")}</select></label>
      ${advTick("show_all_screens", a, "Show all the older screens (Connect ... Production)")}
    </div></details>`;
  const P = T.prefs; const prefs = P ? (P.values.quiz_done ? prefsCard(P) : quizCard(P)) : "";
  $("main").innerHTML = `<section class="left" style="flex-basis:100%;max-width:1100px">${codeBanner}${mode}${seen}${corners}${P && !P.values.quiz_done ? prefs : ""}${stat}${bigs}${visitPickCard()}<div class="err" id="err"></div>${P && P.values.quiz_done ? prefs : ""}${adv}</section>`;
  wireStart();
  if (P) wirePrefs();
}
// (e11, Nick 9 Nov) Visit points in an order Nick chooses: typed (P01,P05,P11,P05), clicked on the map, or clicked in the
// overhead camera's picture (the nearest sticker, through the site's camera model). Repeats allowed; points the camera
// cannot read are flagged and skipped unless "keep them" is ticked. Empty order: Visit points as before (shared out).
let VP = null, vpOrder = [], vpKeep = null, vpLoading = false, vpPic = 0, vpStamp = Date.now();
function vpParse(t) { return String(t || "").split(/[ ,;]+/).map(x => x.trim().toUpperCase()).filter(Boolean).map(x => { const m = x.match(/^P?(\d+)$/); return m ? "P" + String(+m[1]).padStart(2, "0") : x; }); }
function visitPickCard() {
  if (!isTags() || ((S.start || {}).advanced || {}).visit_order === "off") return "";
  if (!VP) return `<div class="card" id="vpcard"><h2>Visit points in your order (optional)</h2><p class="small muted">Loading the stickers...</p></div>`;
  if (vpKeep === null) vpKeep = String((((S.start || {}).advanced || {}).visit_keep_unreadable) ?? "on") !== "off";   // (Nick 9 Nov) tours try unreadable points by default
  const [L, W] = VP.table, nums = {};
  vpOrder.forEach((l, i) => { (nums[l] = nums[l] || []).push(i + 1); });
  const bad = vpOrder.filter((l, i) => VP.unreadable[l] && vpOrder.indexOf(l) === i);
  const unknown = vpOrder.filter((l, i) => !VP.points[l] && vpOrder.indexOf(l) === i);
  const P = VP.points, pad = 6;
  const line = vpOrder.filter(l => P[l]).map(l => `${P[l][0]},${W - P[l][1]}`).join(" ");
  const dots = Object.keys(P).sort().map(l => { const [x, y] = P[l], un = !!VP.unreadable[l], n = nums[l];
    return `<g data-vpl="${l}" style="cursor:pointer"><circle cx="${x}" cy="${W - y}" r="6.5" fill="${n ? "#1F6FEB" : un ? "#F3D2CF" : "#E8E8E8"}" stroke="${un ? "#B42318" : "#777"}" stroke-width="${un ? 1.4 : 0.6}"/><text x="${x}" y="${W - y + 13.5}" font-size="6.5" text-anchor="middle" fill="${un ? "#B42318" : "#444"}">${l}</text>${n ? `<text x="${x}" y="${W - y + 2.4}" font-size="${n.length > 1 ? 4.6 : 7}" font-weight="700" text-anchor="middle" fill="#fff">${n.join(",")}</text>` : ""}</g>`; }).join("");
  const sz = VP.size || [1280, 960];
  const marks = Object.keys(VP.px || {}).sort().map(l => { const [u, v] = VP.px[l], n = nums[l], un = !!VP.unreadable[l];
    const k = sz[0] / 640;     // marks sized for the picture as shown (about 640 px wide)
    return `<g><circle cx="${u}" cy="${v}" r="${(n ? 13 : 7) * k}" fill="${n ? "rgba(31,111,235,.9)" : "rgba(255,255,255,.35)"}" stroke="${un ? "#E5484D" : "#4C9AFF"}" stroke-width="${2 * k}"/>${n ? `<text x="${u}" y="${v + 5 * k}" font-size="${(n.length > 1 ? 11 : 15) * k}" font-weight="700" text-anchor="middle" fill="#fff">${n.join(",")}</text>` : `<text x="${u}" y="${v - 10 * k}" font-size="${10 * k}" font-weight="700" text-anchor="middle" fill="#fff" stroke="#000" stroke-width="${0.35 * k}">${l}</text>`}</g>`; }).join("");
  const src = vpPic === 0 ? `/api/frame?cam=${VP.cam}&t=${vpStamp}` : `/api/tags/picture?cam=${VP.cam}&t=${vpStamp}`;
  return `<div class="card" id="vpcard"><h2>Visit points in your order (optional)</h2>
    <p class="small" style="margin:0 0 8px">Type the stickers, or click them on the map or in the camera's picture, in the order the robot should visit them. Repeats are fine. Leave it empty for the usual Visit points (the points shared out). One robot takes the whole list; with more robots each takes the next run of points.</p>
    <div class="row" style="align-items:center;gap:8px;flex-wrap:wrap"><input id="vptxt" style="flex:1 1 260px;font-size:15px" placeholder="e.g. P01,P05,P11,P05" value="${esc(vpOrder.join(","))}"><button id="vpundo" ${vpOrder.length ? "" : "disabled"}>Undo last</button><button id="vpclear" ${vpOrder.length ? "" : "disabled"}>Clear</button><label class="small"><input type="checkbox" id="vpkeep" ${vpKeep ? "checked" : ""}> try unreadable points anyway (this run)</label></div>
    <div class="row" style="align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px"><span class="small"><b>Presets:</b></span>${Object.keys(VP.presets || {}).map(k => `<button class="small" data-vpp="${esc(k)}">${esc(k)}</button>`).join("")}<button class="small" id="vpsave" ${vpOrder.length ? "" : "disabled"}>Save this order as...</button></div>
    <div class="row" style="align-items:center;gap:14px;flex-wrap:wrap;margin-top:8px"><label class="small">Speed (cm/s) <input data-advn="visit_speed_cms" value="${esc(((S.start || {}).advanced || {}).visit_speed_cms ?? 10)}" style="width:60px"></label><label class="small">Stop at each point (s) <input data-advn="visit_dwell_s" value="${esc(((S.start || {}).advanced || {}).visit_dwell_s ?? 8)}" style="width:60px"></label><label class="small">Drive pieces (cm, 0 = whole leg) <input data-advn="visit_chunk_cm" value="${esc(((S.start || {}).advanced || {}).visit_chunk_cm ?? 0)}" style="width:60px"></label><span class="small muted">(Jay-Sun's tours: 10 cm/s, 8 s.) Every stop is logged with its arrival, dwell start and end (Unix time) and the camera's position: run/stops.csv.</span></div>
    ${vpOrder.length ? `<p class="small" style="margin:8px 0 0"><b>Order (${vpOrder.length}):</b> ${vpOrder.map((l, i) => `${i + 1}. ${esc(l)}${VP.unreadable[l] ? " (camera cannot read)" : ""}`).join(" &rarr; ")}. Straight lines, turns on the spot. Press <b>Visit points</b> above to run it.</p>` : ""}
    ${bad.length ? `<div class="corners" style="margin:8px 0 0"><b>${vpKeep ? "Tried anyway this run" : "Will be SKIPPED"}: ${esc(bad.join(", "))}</b><p class="small" style="margin:4px 0 0">The camera cannot read a roof tag there (${esc(bad.map(l => l + ": " + (VP.unreadable[l] || "")).join("; "))}), so the robot cannot be tracked at that stop. ${vpKeep ? "Those stops are driven on the robot's own wheels and gyro; their camera position will be missing or poor." : "Tick 'try unreadable points anyway' to keep them for this run."}</p></div>` : ""}
    ${unknown.length ? `<p class="small" style="margin:6px 0 0;color:#B42318"><b>${esc(unknown.join(", "))}:</b> no such sticker here (P01 to P40): the run would not start.</p>` : ""}
    <div class="row" style="gap:14px;margin-top:10px;align-items:flex-start;flex-wrap:wrap">
      <figure style="margin:0;flex:1 1 420px"><svg id="vpmap" viewBox="${-pad} ${-pad} ${L + 2 * pad} ${W + 2 * pad + 8}" style="width:100%;background:#FAFAF7;border:1px solid #ccc;border-radius:8px"><rect x="0" y="0" width="${L}" height="${W}" fill="#F1EEE6" stroke="#999"/>${line ? `<polyline points="${line}" fill="none" stroke="#1F6FEB" stroke-width="1.2" stroke-dasharray="3 2"/>` : ""}${dots}</svg>
        <figcaption class="small muted">The table seen from above (${L.toFixed(0)} x ${W.toFixed(0)} cm, the site's sticker sheet): click a sticker to add it. Red rings: the camera cannot read a roof tag there.</figcaption></figure>
      <figure style="margin:0;flex:1 1 420px"><div style="position:relative;line-height:0"><img id="vpimg" src="${src}" alt="The overhead camera's picture: click a sticker to add it" style="width:100%;border-radius:8px;cursor:crosshair;display:block" draggable="false"><svg viewBox="0 0 ${sz[0]} ${sz[1]}" preserveAspectRatio="none" style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none">${marks}</svg></div>
        <figcaption class="small muted">${VP.cam === "overhead" ? "The overhead camera" : esc(VP.cam)}'s ${vpPic === 0 ? "live" : "last setup"} picture${VP.practice ? " (practice: the simulator's)" : ""}: click a sticker (the nearest one is taken, through the camera's model). ${Object.keys(VP.px || {}).length ? "" : esc((VP.words || []).join(" "))} <a href="#" id="vprefresh">New picture</a></figcaption></figure></div></div>`;
}
async function vpLoad() { if (vpLoading) return; vpLoading = true; try { VP = await api("/api/visit/points?cam=overhead"); } catch (e) { VP = null; } vpLoading = false; render(); }
function vpAdd(l) { vpOrder.push(l); render(); }
function wireVisitPick() {
  if (!$("vpcard")) return;
  if (!VP) { vpLoad(); return; }
  if ($("vptxt")) $("vptxt").onchange = () => { vpOrder = vpParse($("vptxt").value); render(); };
  if ($("vpundo")) $("vpundo").onclick = () => { vpOrder.pop(); render(); };
  if ($("vpclear")) $("vpclear").onclick = () => { vpOrder = []; render(); };
  if ($("vpkeep")) $("vpkeep").onchange = () => { vpKeep = $("vpkeep").checked; render(); };
  document.querySelectorAll("[data-vpp]").forEach(b => b.onclick = () => { vpOrder = (VP.presets[b.dataset.vpp] || []).slice(); render(); });
  if ($("vpsave")) $("vpsave").onclick = async () => { const n = prompt("A name for this order:"); if (!n) return; try { const r = await api("/api/visit/preset", {name: n, order: vpOrder.join(",")}); VP.presets = r.presets; flash("Saved: " + n); render(); } catch (e) { flash(e.message, true); } };
  if ($("vprefresh")) $("vprefresh").onclick = (e) => { e.preventDefault(); vpPic = 0; vpStamp = Date.now(); VP = null; render(); };
  document.querySelectorAll("[data-vpl]").forEach(g => g.onclick = () => vpAdd(g.dataset.vpl));
  const img = $("vpimg");
  if (img) {
    img.onerror = () => { if (vpPic === 0) { vpPic = 1; img.src = `/api/tags/picture?cam=${VP.cam}&t=${vpStamp}`; } };
    img.onclick = (e) => {
      const sz = VP.size || [img.naturalWidth, img.naturalHeight], r = img.getBoundingClientRect();
      const u = (e.clientX - r.left) / r.width * sz[0], v = (e.clientY - r.top) / r.height * sz[1];
      let best = null, bd = 1e9;
      for (const [l, p] of Object.entries(VP.px || {})) { const d = Math.hypot(p[0] - u, p[1] - v); if (d < bd) { bd = d; best = l; } }
      if (best && bd <= Math.max(40, sz[0] / 18)) vpAdd(best); else flash("No sticker near that spot in the picture: click closer to one (or use the map)", true);
    };
  }
}
function placeName(w) { const k = (w || {}).kind; return k === "home" ? "Home: the 4 x 4 ft board" : k === "school" ? "School: the conference table" : k === "new" ? "A new area (" + (w.site || "") + ")" : ((S.site && S.site.title) || "Home"); }
function wireStart() {
  document.querySelectorAll("[data-run]").forEach(b => b.onclick = async () => {
    const k = b.dataset.run, T = S.start; let attended = false;
    if (!T.practice) {
      if (!confirm(`Start ${b.querySelector("b").textContent} on every robot on the table?`)) return;
      if (T.attended_only) { attended = confirm("At school the robots drive only while Jay-Sun is in the room. Is he here?"); if (!attended) return; }
      else if (T.prefs && T.prefs.values.watching !== "ask") attended = T.prefs.values.watching === "yes";
      else attended = confirm("Will you stay with the robots? (OK: the run may ask you here about a robot it is not sure about near an edge, and holds that robot until you answer. Cancel: it decides alone and never moves a robot it is unsure about outward.)");
    }
    const body = {kind: k, attended};
    if (k === "visit" && vpOrder.length) { body.order = vpOrder.join(","); body.keep_unreadable = vpKeep; }   // (e11) Nick's order
    try { await api("/api/start/run", body); flash(T.practice ? "Practice started (the simulator)" : "Started"); watchStart(); await load(); } catch (e) { flash(e.message, true); } });
  if ($("stopbig")) $("stopbig").onclick = stopAll;
  wireVisitPick();
  document.querySelectorAll("[data-qid]").forEach(b => b.onclick = async () => { try { S.start = await api("/api/start/answer", {id: b.dataset.qid, choice: b.dataset.choice}); flash("Answer sent: " + b.dataset.choice); render(); } catch (e) { flash(e.message, true); } });
  if ($("gocorners")) $("gocorners").onclick = () => { screen = isTags() ? 7 : 1; render(); };
  if ($("restartmc")) $("restartmc").onclick = async () => {    // (e12) only when no run is going (the server checks too)
    try { const r = await api("/api/restart", {}); flash(r.words || "Restarting"); setTimeout(() => location.reload(), 6000); } catch (e) { flash(e.message, true); } };
  const box = $("advbox"); if (box) { box.open = !!window._advOpen; box.ontoggle = () => { window._advOpen = box.open; }; }
  document.querySelectorAll("[data-adv]").forEach(e => e.onchange = () => saveAdv({[e.dataset.adv]: e.value}));
  document.querySelectorAll("[data-advb]").forEach(e => e.onchange = () => saveAdv({[e.dataset.advb]: e.checked}));
  document.querySelectorAll("[data-advn]").forEach(e => e.onchange = () => saveAdv({[e.dataset.advn]: +e.value}));
  if ($("savetyped")) $("savetyped").onclick = async () => { try { for (const e of document.querySelectorAll("[data-typed]")) S.start = await api("/api/start/typed", {key: e.dataset.typed, value: e.value}); flash("Typed values saved"); render(); } catch (e) { flash(e.message, true); } };
  if ($("sitepin")) $("sitepin").onchange = async () => { try { const r = await api("/api/start/site", {pin: $("sitepin").value}); flash(r.words); } catch (e) { flash(e.message, true); } };
  if (S.start.status && S.start.status.running) watchStart();
}
async function saveAdv(d) { try { S.start = await api("/api/start/advanced", d); flash("Saved"); render(); } catch (e) { flash(e.message, true); } }
async function stopAll() { try { const r = await api("/api/start/stop", {}); flash("STOP sent: " + r.stopped.join(", ")); await load(); } catch (e) { flash(e.message, true); } }
function watchStart() { if (stPoll) return; stPoll = setInterval(async () => { try { S.start = await api("/api/start"); } catch (e) { return; }
  if (screen === 9 && !document.activeElement.matches("input,select")) { const y = window.scrollY; render(); window.scrollTo(0, y); }
  if (!S.start.status.running) { clearInterval(stPoll); stPoll = null; load(); } }, 2000); }
$("stopall").onclick = async () => { if (S && S.start) return stopAll(); try { await api("/api/run/stop", {}); flash("Stop sent"); await load(); } catch (e) { flash(e.message, true); } };

$("details").onchange = e => { document.body.classList.toggle("details", e.target.checked); render(); };
load().then(() => { if (S.run && S.run.running) stPoll(); });
</script>
